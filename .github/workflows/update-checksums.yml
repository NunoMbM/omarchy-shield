name: Auto-Update PKGBUILD Checksums

on:
  push:
    branches: [ main ]
    paths:
      - 'omarchy-shield-ctl'
      - 'org.omarchy.shield.policy'
      - 'ShieldWidget.qml'
      - 'shell.qml'
      - 'PKGBUILD'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean NBSP and update SHA-256 hashes in PKGBUILD
        run: |
          sed -i 's/\xc2\xa0/ /g' PKGBUILD omarchy-shield-ctl org.omarchy.shield.policy ShieldWidget.qml shell.qml
          H1=$(sha256sum omarchy-shield-ctl | awk '{print $1}')
          H2=$(sha256sum org.omarchy.shield.policy | awk '{print $1}')
          H3=$(sha256sum ShieldWidget.qml | awk '{print $1}')
          H4=$(sha256sum shell.qml | awk '{print $1}')
          python3 -c "import re, pathlib; p = pathlib.Path('PKGBUILD'); s = \"sha256sums=(\n    '$H1'\n    '$H2'\n    '$H3'\n    '$H4'\n)\"; p.write_text(re.sub(r'sha256sums=\([^)]+\)', s, p.read_text(), flags=re.S))"

      - name: Commit updated files if changed
        run: |
          if [[ -n $(git status --porcelain PKGBUILD omarchy-shield-ctl org.omarchy.shield.policy ShieldWidget.qml shell.qml) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add PKGBUILD omarchy-shield-ctl org.omarchy.shield.policy ShieldWidget.qml shell.qml
            git commit -m "chore(pkgbuild): clean NBSP and update real sha256sums [skip ci]"
            git push
          fi

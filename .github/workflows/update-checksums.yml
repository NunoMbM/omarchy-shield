name: Auto-Update PKGBUILD Checksums

on:
  push:
    branches: [ main ]
    paths:
      - 'omarchy-shield-ctl'
      - 'org.omarchy.shield.policy'
      - 'ShieldWidget.qml'
      - 'shell.qml'
      - 'PKGBUILD'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update SHA-256 hashes in PKGBUILD
        run: |
          H1=$(sha256sum omarchy-shield-ctl | awk '{print $1}')
          H2=$(sha256sum org.omarchy.shield.policy | awk '{print $1}')
          H3=$(sha256sum ShieldWidget.qml | awk '{print $1}')
          H4=$(sha256sum shell.qml | awk '{print $1}')
          perl -0777 -i -pe "s/sha256sums=\([^)]+\)/sha256sums=(\n    '$H1'\n    '$H2'\n    '$H3'\n    '$H4'\n)/s" PKGBUILD

      - name: Commit and push if PKGBUILD changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD
          if ! git diff --cached --quiet; then
            git commit -m "chore(pkgbuild): update real sha256sums [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

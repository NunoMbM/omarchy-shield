name: Auto-Update PKGBUILD Checksums

on:
  push:
    branches: [ main ]
    paths:
      - 'omarchy-shield-ctl'
      - 'org.omarchy.shield.policy'
      - 'ShieldWidget.qml'
      - 'shell.qml'
      - 'LICENSE'
      - 'PKGBUILD'
      - '.github/workflows/update-checksums.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate SHA-256 hashes and push PKGBUILD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            H1=$(sha256sum omarchy-shield-ctl | awk '{print $1}')
            H2=$(sha256sum org.omarchy.shield.policy | awk '{print $1}')
            H3=$(sha256sum ShieldWidget.qml | awk '{print $1}')
            H4=$(sha256sum shell.qml | awk '{print $1}')
            H5=$(sha256sum LICENSE | awk '{print $1}')

            python3 - <<EOF
          import re
          with open('PKGBUILD', 'r') as f:
              content = f.read()
          new_sums = """sha256sums=(
              '$H1'
              '$H2'
              '$H3'
              '$H4'
              '$H5'
          )"""
          updated = re.sub(r'# Run .*?\nsha256sums=\([^)]+\)', new_sums, content, flags=re.DOTALL)
          updated = re.sub(r'sha256sums=\([^)]+\)', new_sums, updated, flags=re.DOTALL)
          with open('PKGBUILD', 'w') as f:
              f.write(updated)
          EOF

            if [[ -z $(git status --porcelain PKGBUILD) ]]; then
              echo "No checksum changes, nothing to commit."
              exit 0
            fi

            git add PKGBUILD
            git commit -m "chore(pkgbuild): update real sha256sums [skip ci]"

            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push rejected (attempt $attempt), retrying after backoff..."
            sleep $(( RANDOM % 5 + 1 ))
          done

          echo "::error::Failed to push updated PKGBUILD after 5 attempts."
          exit 1

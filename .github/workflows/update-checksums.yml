name: Auto-Update PKGBUILD Checksums

on:
  push:
    branches: [ main ]
    paths:
      - 'omarchy-shield-ctl'
      - 'org.omarchy.shield.policy'
      - 'ShieldWidget.qml'
      - 'shell.qml'
      - 'PKGBUILD'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate real SHA-256 hashes and update PKGBUILD
        run: |
          H1=$(sha256sum omarchy-shield-ctl | awk '{print $1}')
          H2=$(sha256sum org.omarchy.shield.policy | awk '{print $1}')
          H3=$(sha256sum ShieldWidget.qml | awk '{print $1}')
          H4=$(sha256sum shell.qml | awk '{print $1}')

          python3 - <<EOF
          import re
          with open('PKGBUILD', 'r') as f:
              content = f.read()
          new_sums = """sha256sums=(
              '$H1'
              '$H2'
              '$H3'
              '$H4'
          )"""
          updated = re.sub(r'# Run .*?\nsha256sums=\([^)]+\)', new_sums, content, flags=re.DOTALL)
          updated = re.sub(r'sha256sums=\([^)]+\)', new_sums, updated, flags=re.DOTALL)
          with open('PKGBUILD', 'w') as f:
              f.write(updated)
          EOF

      - name: Commit updated PKGBUILD if hashes changed
        run: |
          if [[ -n $(git status --porcelain PKGBUILD) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add PKGBUILD
            git commit -m "chore(pkgbuild): update real sha256sums [skip ci]"
            git push
          fi

name: CI (ShellCheck, Bats & Arch Namcap)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: ShellCheck & Bats Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bats and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Run ShellCheck on omarchy-shield-ctl
        run: shellcheck -s bash omarchy-shield-ctl

      - name: Run Bats test suite
        run: bats tests/omarchy-shield.bats

  arch-packaging:
    name: PKGBUILD & Namcap Validation
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install base-devel and namcap
        run: |
          pacman -Syu --noconfirm base-devel namcap
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package and run namcap
        run: |
          su builder -c "makepkg -s --nodeps --noconfirm"
          namcap -i PKGBUILD
          namcap -i omarchy-shield-*.pkg.tar.*
